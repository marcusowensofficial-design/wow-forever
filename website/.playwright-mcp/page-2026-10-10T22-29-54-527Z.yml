            - heading "Dungeon quests The ones to take before you go in, from level 13 to 30" [level=1] [ref=f8e68]:
              - text: Dungeon quests
              - generic [ref=f8e69]: The ones to take before you go in, from level 13 to 30
            - paragraph [ref=f8e70]:
              - text: "A dungeon run with all its quests is still the biggest chunk of experience on your way to 30. Since the update of October 1, a dungeon quest pays about 2.2 times Classic’s experience, against 3.1 times before: Blizzard halved what it gives beyond a normal quest ("
              - link "Blizzard’s notes" [ref=f8e71] [cursor=pointer]:
                - /url: https://us.forums.blizzard.com/en/wow/t/2360696/4
              - text: ).
            - paragraph [ref=f8e72]: "The catch: most of these quests are given far from the dungeon, in a capital or a camp at the other end of the zone, and some need a quest before them. Set your faction and your level: the tour below lists what to pick up, town by town, and you tick each quest as you take it."
            - paragraph [ref=f8e73]:
              - text: By Vektor, updated October 9, 2026.
