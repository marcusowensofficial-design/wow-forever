          - region [ref=f8e1745]:
            - heading "Before you go" [level=2] [ref=f8e1747]
            - list [ref=f8e1748]:
              - listitem [ref=f8e1749]: "Some need another quest first. Sometimes a whole chain: “The Stockade Riots” starts with the letter VanCleef drops at the end of the Deadmines. When the quest before is marked optional, it only leads you to the giver and you can skip it."
              - listitem [ref=f8e1750]: "No bonus before the door. “Collecting Memories”, “Oh Brother. . .”, “The Essence of Aku'Mai”, “Researching the Corruption” are done on the way to the dungeon, without going in: they give what they gave in Classic."
              - listitem [ref=f8e1751]:
                - text: "Once is enough for the experience. Once your quests are handed in, another run only gives the monsters’ experience. Run it again for its loot if you want, then move on to the next dungeon or back to the quests of your zone: my road from 20 to 30 is in the"
                - link "level 30 guide" [ref=f8e1752] [cursor=pointer]:
                  - /url: /level-30#leveling
                - text: .
              - listitem [ref=f8e1753]:
                - text: Mind the highest level in the group. Since the October 8 update, each of you earns a kill’s experience by your own level (
                - link "Blizzard’s notes" [ref=f8e1754] [cursor=pointer]:
                  - /url: https://us.forums.blizzard.com/en/wow/t/2360696/5
                - text: "), but a monster grey for the highest level in the group gives nothing to anyone. And a monster below you gives less in Forever than in Classic:"
                - link "what each level costs" [ref=f8e1755] [cursor=pointer]:
                  - /url: /level-30#kill-xp
                - text: .
              - listitem [ref=f8e1756]: "Count what a quest asks of each of you. In the City of Dalaran, the Horde’s “Source of Power” asks each of you for six Cracked Sentry Cores, and a run has only 12 to 15 sentries, each giving one core: a group of five needs two or three runs."
          - generic [ref=f8e1757]:
            - paragraph [ref=f8e1758]:
              - text: The quests, their givers and their chains come from cMaNGOS (a free project that rebuilds Classic’s servers) for Classic’s quests, and from Wowhead’s Forever database for the new ones and the translated names. The experience is what the beta server answered for each quest, halved as
              - link "Blizzard’s notes" [ref=f8e1759] [cursor=pointer]:
                - /url: https://us.forums.blizzard.com/en/wow/t/2360696/4
              - text: of October 1 say. The tooltips come from the beta client.
            - paragraph [ref=f8e1760]: If a quest gives you something else, or is given somewhere else, tell me.
