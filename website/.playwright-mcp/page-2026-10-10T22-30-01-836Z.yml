        - generic [ref=f9e102]:
          - region [ref=f9e103]:
            - heading "Setting up camp" [level=2] [ref=f9e105]
            - list [ref=f9e106]:
              - listitem [ref=f9e107]:
                - generic [aria-hidden] [ref=f9e108]: "1"
                - generic [ref=f9e109]:
                  - heading "Light a campfire" [level=3] [ref=f9e110]
                  - paragraph [ref=f9e111]:
                    - text: A
                    - link "Basic Campfire Kit" [ref=f9e112]:
                      - /url: /item/279981
                    - text: takes Cooking 1 and one
                    - link "Simple Wood" [ref=f9e113]:
                      - /url: /item/4470
                    - text: . It holds 3 camp objects around it. The
                    - link "Journeyman Campfire Kit" [ref=f9e114]:
                      - /url: /item/279961
                    - text: and the
                    - link "Expert Campfire Kit" [ref=f9e115]:
                      - /url: /item/279974
                    - text: ", from blueprints, hold 5 and 10."
              - listitem [ref=f9e116]:
                - generic [aria-hidden] [ref=f9e117]: "2"
                - generic [ref=f9e118]:
                  - heading "Place the rack or the wheel by the fire" [level=3] [ref=f9e119]
                  - paragraph [ref=f9e120]:
                    - text: It takes 140 skill in its trade. It goes over a
                    - link "Camp Tent" [ref=f9e121]:
                      - /url: /item/279978
                    - text: or a
                    - link "Faction Banner" [ref=f9e122]:
                      - /url: /item/279972
                    - text: "and keeps what they give: rested experience from the tent, Spirit for your faction from the banner."
              - listitem [ref=f9e123]:
                - generic [aria-hidden] [ref=f9e124]: "3"
                - generic [ref=f9e125]:
                  - heading "Craft next to it" [level=3] [ref=f9e126]
                  - paragraph [ref=f9e127]: Stay within reach while you craft, as at a town’s anvil. Players who sit or craft by the fire for a minute also get the camp’s bonuses.
            - generic [ref=f9e128]:
              - generic [ref=f9e129]:
                - term [ref=f9e130]: 15 minutes
                - definition [ref=f9e131]: A placed rack or wheel stays 15 minutes, then it’s gone.
              - generic [ref=f9e132]:
                - term [ref=f9e133]: Used up
                - definition [ref=f9e134]: "Placing it uses the item: each new rack or wheel costs its reagents again."
              - generic [ref=f9e135]:
                - term [ref=f9e136]: One hour between camp objects
                - definition [ref=f9e137]: Every camp object you place shares one 60 minute cooldown. The campfire has its own, 5 minutes.
            - paragraph [ref=f9e138]: "My advice: put the reagents of the whole batch in your bags before you place the rack. 15 minutes is enough for a batch, and the next rack is an hour away."
          - region [ref=f9e139]:
            - heading "Tanning Rack" [level=2] [ref=f9e141]
            - generic [ref=f9e142]:
              - generic [ref=f9e145]:
                - generic [ref=f9e146]: "Blueprint: Tanning Rack"
                - generic [ref=f9e147]: Item Level 25
                - generic [ref=f9e148]: Leatherworking
                - generic [ref=f9e149]: Requires Leatherworking (140)
                - generic [ref=f9e150]: "Use: Craft a Tanning Rack."
                - generic [ref=f9e151]: "\"Teaches you how to place a Tanning Rack at a campsite.\""
                - generic [ref=f9e152]: "Sell Price: 3 75"
              - generic [ref=f9e153]:
                - generic [ref=f9e154]:
                  - term [ref=f9e155]: Razorclaw the Butcher
                  - definition [ref=f9e156]:
                    - text: Razorclaw the Butcher in
                    - link "Shadowfang Keep" [ref=f9e157] [cursor=pointer]:
                      - /url: /dungeons/shadowfang-keep
                    - text: "drops the blueprint, rarely: about once in 900 kills."
                - generic [ref=f9e158]:
                  - term [ref=f9e159]: Leatherworking 140
                  - definition [ref=f9e160]: The skill to learn the blueprint, and to place a rack.
                - generic [ref=f9e161]:
                  - term [ref=f9e162]: Each rack costs
                  - definition [ref=f9e163]:
                    - link "5 × Medium Leather" [ref=f9e164]:
                      - /url: /item/2319
                    - text: ","
                    - link "3 × Fine Thread" [ref=f9e165]:
                      - /url: /item/2321
                    - text: and
                    - link "2 × Simple Wood" [ref=f9e166]:
                      - /url: /item/4470
                    - text: . Thread and wood are sold by trade supplies vendors.
                - generic [ref=f9e167]:
                  - term [ref=f9e168]: Both can be traded
                  - definition [ref=f9e169]: The blueprint and the rack itself can be bought and sold at the auction house.
            - paragraph [ref=f9e170]: The first rack recipes open at 125 skill (6 blue kilts and legguards), but placing a rack takes 140. In between, you craft at another leatherworker’s rack.
            - paragraph [ref=f9e171]:
              - text: 21 of these recipes also ask for
              - link "Pristine Leather" [ref=f9e172]:
                - /url: /item/249427
              - text: ", which the rack does not make. It comes from"
              - link "Skinning" [ref=f9e173] [cursor=pointer]:
                - /url: /professions/skinning
              - text: ": a Scarce material that a beast you skin gives now and then, on top of its leather. The"
              - link "Legacy" [ref=f9e174] [cursor=pointer]:
                - /url: /legacy-perks
              - text: perk Bountiful Harvest gives 20% more per rank.
            - paragraph [ref=f9e175]:
              - text: 37 of the 48 are new Forever patterns, the blue armour of level 25 to 30. The other 11 are Classic patterns that needed nothing in Classic,
              - link "Wolfshead Helm" [ref=f9e176]:
                - /url: /item/8345
              - text: and
              - link "Barbaric Bracers" [ref=f9e177]:
                - /url: /item/18948
              - text: among them.
              - link "See them all" [ref=f9e178] [cursor=pointer]:
                - /url: "#recipes-rack"
          - region [ref=f9e179]:
            - heading "Spinning Wheel" [level=2] [ref=f9e181]
            - generic [ref=f9e182]:
              - generic [ref=f9e185]:
                - generic [ref=f9e186]: "Blueprint: Spinning Wheel"
                - generic [ref=f9e187]: Item Level 25
                - generic [ref=f9e188]: Tailoring
                - generic [ref=f9e189]: Requires Tailoring (140)
                - generic [ref=f9e190]: "Use: Craft a Spinning Wheel."
                - generic [ref=f9e191]: "\"Teaches you how to place a Spinning Wheel at a campsite.\""
                - generic [ref=f9e192]: "Sell Price: 3 75"
              - generic [ref=f9e193]:
                - generic [ref=f9e194]:
                  - term [ref=f9e195]: Unstable Sentinel
                  - definition [ref=f9e196]:
                    - text: The Unstable Sentinel in the
                    - link "City of Dalaran" [ref=f9e197] [cursor=pointer]:
                      - /url: /dungeons/city-of-dalaran
                    - text: "drops the blueprint. How often is not known yet: the dungeon opened on October 8."
                - generic [ref=f9e198]:
                  - term [ref=f9e199]: Tailoring 140
                  - definition [ref=f9e200]: The skill to learn the blueprint, and to place a wheel.
                - generic [ref=f9e201]:
                  - term [ref=f9e202]: Each wheel costs
                  - definition [ref=f9e203]:
                    - link "2 × Simple Wood" [ref=f9e204]:
                      - /url: /item/4470
                    - text: ","
                    - link "5 × Bolt of Silk Cloth" [ref=f9e205]:
                      - /url: /item/4305
                    - text: and
                    - link "3 × Fine Thread" [ref=f9e206]:
                      - /url: /item/2321
                    - text: . Thread and wood are sold by trade supplies vendors, the silk you weave yourself.
                - generic [ref=f9e207]:
                  - term [ref=f9e208]: Over the Faction Banner
                  - definition [ref=f9e209]:
                    - text: It replaces the
                    - link "Faction Banner" [ref=f9e210]:
                      - /url: /item/279972
                    - text: at camp and keeps its Spirit for your faction.
            - paragraph [ref=f9e211]:
              - text: "A wheel opens 74 tailoring recipes: 54 new Forever patterns, the blue leggings, slippers, handwraps, cords, shoulders, cuffs, waistcords, gloves and sandals of level 25 to 30, and 20 Classic ones, the Mooncloth and Dreamweave pieces among them."
              - link "See them all" [ref=f9e212] [cursor=pointer]:
                - /url: "#recipes-wheel"
            - paragraph [ref=f9e213]:
              - text: Our
              - link "best-in-slot" [ref=f9e214] [cursor=pointer]:
                - /url: /bis
              - text: lists count the pieces made at a Spinning Wheel, and say where its blueprint drops.
