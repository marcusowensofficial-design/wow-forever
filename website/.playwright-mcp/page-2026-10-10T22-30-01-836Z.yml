            - paragraph [ref=f9e1564]:
              - text: "At 300 skill, a third camp object takes over from each: the"
              - link "Sewing Machine" [ref=f9e1565]:
                - /url: /item/279945
              - text: for leatherworkers (91 recipes) and the
              - link "Loom" [ref=f9e1566]:
                - /url: /item/279959
              - text: "for tailors (43). Every trade climbs the same three steps at camp: the"
              - link "professions page" [ref=f9e1567] [cursor=pointer]:
                - /url: /professions#camp
              - text: lists them, and
              - link "Camping" [ref=f9e1568] [cursor=pointer]:
                - /url: /professions/camping
              - text: explains the campfire.
          - paragraph [ref=f9e1570]:
            - text: "The objects, their blueprints, the recipes that need them, the 15 minutes and the shared hour: the beta client (build 1.60.1.70338). The blueprint’s drop rate:"
            - link "Wowhead" [ref=f9e1571] [cursor=pointer]:
              - /url: https://www.wowhead.com/forever/item=273096/blueprint-tanning-rack
            - text: "’s Forever database, 18 in 16,486 kills on October 5. Pristine Leather from skinning: the same database. Buying a rack and having it placed: a player on the"
            - link "Blizzard forums" [ref=f9e1572] [cursor=pointer]:
              - /url: https://us.forums.blizzard.com/en/wow/t/tanning-racks-in-world-locations/2370728
            - text: ". The Spinning Wheel’s blueprint:"
            - link "the request on the European forums" [ref=f9e1573] [cursor=pointer]:
              - /url: https://eu.forums.blizzard.com/en/wow/t/please-give-us-a-way-to-obtain-the-spinning-wheel-blueprint/633923
            - text: .
