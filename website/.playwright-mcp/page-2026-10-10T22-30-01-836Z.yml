      - generic [ref=f9e63]:
        - generic [ref=f9e66]:
          - generic [ref=f9e67]:
            - link "Guides" [ref=f9e68] [cursor=pointer]:
              - /url: /guides
            - heading "Tanning Rack and Spinning Wheel WoW Forever beta" [level=1] [ref=f9e69]:
              - text: Tanning Rack and Spinning Wheel
              - generic [ref=f9e70]: WoW Forever beta
            - paragraph [ref=f9e71]:
              - text: You have the leather for a
              - link "Defender's Leather Kilt" [ref=f9e72]:
                - /url: /item/252457
              - text: "and the recipe still won’t craft: it asks for a"
              - link "Tanning Rack" [ref=f9e73]:
                - /url: /item/279941
              - text: . In Forever, 48 leatherworking recipes can only be made next to one, and 74 tailoring recipes next to a
              - link "Spinning Wheel" [ref=f9e74]:
                - /url: /item/279943
              - text: ". You won’t find either in town: you set your own up at a campfire."
            - paragraph [ref=f9e75]: "Three things to know before you start:"
            - list [ref=f9e76]:
              - listitem [ref=f9e77]:
                - text: The Tanning Rack’s blueprint drops from Razorclaw the Butcher in
                - link "Shadowfang Keep" [ref=f9e78] [cursor=pointer]:
                  - /url: /dungeons/shadowfang-keep
                - text: ", rarely, and the Spinning Wheel’s from the Unstable Sentinel in the"
                - link "City of Dalaran" [ref=f9e79] [cursor=pointer]:
                  - /url: /dungeons/city-of-dalaran
                - text: .
              - listitem [ref=f9e80]: A rack lasts 15 minutes and is used up when you place it. Have every reagent in your bags first.
              - listitem [ref=f9e81]: No blueprint, or under 140 skill? Buy a Tanning Rack at the auction house and have a leatherworker with 140 skill place it. You craft next to it as at your own.
            - paragraph [ref=f9e82]: By Vektor, updated October 8, 2026.
          - generic [ref=f9e85]:
            - generic [ref=f9e86]: Tanning Rack
            - generic [ref=f9e87]: Item Level 28
            - generic [ref=f9e88]: Other
            - generic [ref=f9e89]: Requires Leatherworking (140)
            - generic [ref=f9e90]: "Use: Places a Tanning Rack that allows the creation of certain reagents, and provides all of the benefits of a Camp Tent. Requires a Campfire nearby. May be placed over a Camp Tent to replace it. All camping features share a cooldown of 1 hr. (60 Min Cooldown)"
        - navigation "Sections of this page" [ref=f9e91]:
          - generic [ref=f9e92]:
            - link "Setting up camp" [ref=f9e93] [cursor=pointer]:
              - /url: "#camp"
