              - generic [ref=f4e791]:
                - term [ref=f4e792]: Later caps
                - definition [ref=f4e793]: 16 at launch. The client calls it a seasonal cap, and Blizzard says caps will grow in later patches, with no dates.
              - generic [ref=f4e794]:
                - term [ref=f4e795]: Rank cost
                - definition [ref=f4e796]: The planner counts one point per rank, as Wowhead’s calculator does. The client data does not say what a rank costs.
              - generic [ref=f4e797]:
                - term [ref=f4e798]: The 6 “?” perks
                - definition [ref=f4e799]: The client has them, with no name and no effect, marked to be added in a future update.
              - generic [ref=f4e800]:
                - term [ref=f4e801]: Talented
                - definition [ref=f4e802]: In build 1.60.1.70338 it is a node with five one-rank choices, level 9 down to 5. Wowhead’s export shows five ranks, and the planner keeps that reading until the game shows which it is.
        - paragraph [ref=f4e803]:
