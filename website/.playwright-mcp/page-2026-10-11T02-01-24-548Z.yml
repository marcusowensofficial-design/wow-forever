                - text: 1. Core Hunter Rules & Quality of Life
              - paragraph [ref=f2e606]: Fundamental gameplay systems, trap mechanics, resource handling, and baseline adjustments
            - generic [ref=f2e607]:
              - generic [ref=f2e608]:
                - generic [ref=f2e609]:
                  - strong [ref=f2e610]: Pet Ability Retention Fixed
                  - generic [ref=f2e611]: Phase 2 Beta Update (Oct 2026)
                - generic [ref=f2e612]: Pet Mechanics Fix
                - paragraph [ref=f2e613]: Resolved the critical bug where tamed pets spontaneously forgot trained abilities (Bite, Claw, Dash, Growl) upon zoning into instanced dungeons or being dismissed.
              - generic [ref=f2e614]:
                - generic [ref=f2e615]:
                  - strong [ref=f2e616]: Aggressive Pet Stance Restored
                  - generic [ref=f2e617]: Phase 2 Beta Update (Oct 2026)
                - generic [ref=f2e618]: Pet UI Restoration
                - paragraph [ref=f2e619]: Aggressive Stance has been officially restored to the Hunter pet action bar and spellbook, giving pet commanders full tactical autonomy in outdoor combat.
              - generic [ref=f2e620]:
                - generic [ref=f2e621]:
                  - strong [ref=f2e622]: In-Combat Freezing Trap
                  - generic [ref=f2e623]: Verified in Beta
                - generic [ref=f2e624]: Major QoL
                - paragraph [ref=f2e625]: Hunters can now drop Freezing Trap directly while in combat. The cumbersome macro requirement of Feign Death -> Drop Combat -> Place Trap is completely eliminated, dramatically smoothing PvP and dungeon crowd control.
              - generic [ref=f2e626]:
                - generic [ref=f2e627]:
                  - strong [ref=f2e628]: 8-Yard Dead Zone Retained
                  - generic [ref=f2e629]: Verified in Beta
                - generic [ref=f2e630]: Classic Pillar
                - paragraph [ref=f2e631]: The classic 8-yard dead zone (where neither ranged shots nor melee attacks can occur without adjusting distance) is retained to preserve classic spacing tactics and PvP counterplay.
              - generic [ref=f2e632]:
                - generic [ref=f2e633]:
                  - strong [ref=f2e634]: Disengage as Threat Reduction
                  - generic [ref=f2e635]: Verified in Beta
                - generic [ref=f2e636]: Classic Mechanic
                - paragraph [ref=f2e637]: Disengage remains a melee threat-reduction tool rather than modern retail's backward acrobatics leap. Hunters must manage positioning rather than relying on an instant escape button.
              - generic [ref=f2e638]:
                - generic [ref=f2e639]:
                  - strong [ref=f2e640]: Ammunition & Quivers Still Required
                  - generic [ref=f2e641]: Verified in Beta
                - generic [ref=f2e642]: Authenticity
                - paragraph [ref=f2e643]: Physical ammunition (arrows and bullets) and quivers/ammo pouches remain in full effect. Heavy quivers and arrow counts were clearly visible in the inventory during the demo, retaining Hunter RPG flavor.
              - generic [ref=f2e644]:
                - generic [ref=f2e645]:
                  - strong [ref=f2e646]: Single Active Trap Limit & Shared Cooldowns
                  - generic [ref=f2e647]: Verified in Beta
                - generic [ref=f2e648]: Balance Rule
                - paragraph [ref=f2e649]: Only one trap can be active at any given time. Additionally, Fire traps (Immolation, Explosive) and Frost traps (Freezing, Frost) share cooldown categories, requiring strategic trap selection.
              - generic [ref=f2e650]:
                - generic [ref=f2e651]:
                  - strong [ref=f2e652]: Direct Pet Movement Command
                  - generic [ref=f2e653]: Verified in Beta
                - generic [ref=f2e654]: Micro Control
                - paragraph [ref=f2e655]: Hunters can directly command pets to move to a designated target location on the ground, allowing precise pre-pull placement, line-of-sight baiting, and trap routing.
              - generic [ref=f2e656]:
                - generic [ref=f2e657]:
                  - strong [ref=f2e658]: Dedicated Reagent Bag Slot
                  - generic [ref=f2e659]: Verified in Beta
                - generic [ref=f2e660]: Inventory QoL
                - paragraph [ref=f2e661]: An additional dedicated reagent bag slot is visible in the character inventory, freeing up general container space for adventuring gear and ammunition.
