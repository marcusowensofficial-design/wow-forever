                  - generic [ref=f11e321]:
                    - text: ","
                    - link "Shade of the Archmage" [ref=f11e322] [cursor=pointer]:
                      - /url: "#shade-of-the-archmage"
                  - text: .
              - row [ref=f11e323]:
                - rowheader "Immunities" [ref=f11e324]
                - 'cell "Most of the city’s monsters are immune to something. Many take no Arcane damage. The constructs and the elementals take no bleed or poison: Rake, Rip, Rend, rogues’ poisons and Serpent Sting do nothing to them. The treants can bleed but take no Nature damage. A Blizzard developer said on the official podcast of October 8 that the arcane immunity is on purpose." [ref=f11e325]'
              - row [ref=f11e326]:
                - rowheader "Reputation" [ref=f11e327]
                - 'cell "Each kill gives Kirin Tor reputation: 5 for most enemies and for the Arcane Anomaly, Arcanic Enigma, Unstable Sentinel and Mana Devourer, 12 to 13 for the elites of the sewers, 15 for Atrexis, 25 for Lyn the Ignored and the Shade of the Archmage. At Friendly, Archmage Alvareaux, the Kirin Tor quartermaster in the city, sells eight recipes for Blacksmithing, Leatherworking and Tailoring (skill 175); the Kirin Tor Tabard asks Exalted. For the Horde, that reputation is a bug: Blizzard has already fixed it on its side, for the week of October 12, and says Horde characters are not meant to get full access to the city either." [ref=f11e328]'
              - row [ref=f11e329]:
                - rowheader "Story" [ref=f11e330]
                - cell "Backfiring enchantments, arcane constructs, demonic energy and cats. Blizzard calls it a whole city to explore." [ref=f11e331]
        - region [ref=f11e333]:
          - heading "Getting in the quests to Dalaran" [level=2] [ref=f11e336]:
            - text: Getting in
            - generic [ref=f11e337]: the quests to Dalaran
          - generic [ref=f11e338]:
            - paragraph [ref=f11e339]:
              - text: Two short quest lines lead into the dungeon, from level 30, as Wowhead’s Forever database has them, even though the dungeon’s own quests can be taken from level 24. Both end at the Image of Archmage Modera by the city, beside Lordamere Lake. She gives Heart of Disruption, one of the dungeon’s quests, and with it the
              - link "Dalaran Sewer Key" [ref=f11e340] [cursor=pointer]:
                - /url: /item/277507
              - text: . One member of the group holding the key is enough for everyone to go in.
            - list [ref=f11e341]:
              - listitem [ref=f11e342]:
                - text: "Alliance: Emissary Jacques, in Southshore, gives"
                - link "An Alarming Request" [ref=f11e343] [cursor=pointer]:
                  - /url: /quest/92432
                - text: ", which sends you to the Image of Archmage Modera. After"
                - link "Heart of Disruption" [ref=f11e344] [cursor=pointer]:
                  - /url: /quest/92458
                - text: ","
                - link "Friend of the Kirin Tor" [ref=f11e345] [cursor=pointer]:
                  - /url: /quest/92459
                - text: takes the mote to Archmage Celindra in the Violet Citadel.
              - listitem [ref=f11e346]:
                - text: "Horde: Magus Wordeen Voidglare, in Tarren Mill, gives"
                - link "Prison Break In" [ref=f11e347] [cursor=pointer]:
                  - /url: /quest/544
                - text: and
                - link "Key to the City" [ref=f11e348] [cursor=pointer]:
                  - /url: /quest/93680
                - text: ". Both send you to the Lordamere Internment Camp: kill four traitors there for their artifacts, and take the"
                - link "Grimy Key" [ref=f11e349] [cursor=pointer]:
                  - /url: /item/279469
                - text: from the Warden’s Footlocker, upstairs in the two-storey building. The traitors take five to ten minutes to come back, and several groups often wait for them. Then comes
                - link "Dalaran Patrols" [ref=f11e350] [cursor=pointer]:
                  - /url: /quest/545
                - text: ", and"
                - link "Blood in the Streets" [ref=f11e351] [cursor=pointer]:
                  - /url: /quest/92434
                - text: takes you through the sewers on the north side of the city to the Image of Archmage Modera. After
                - link "Heart of Disruption" [ref=f11e352] [cursor=pointer]:
                  - /url: /quest/96984
                - text: ","
                - link "Shrewd Negotiations" [ref=f11e353] [cursor=pointer]:
                  - /url: /quest/97287
                - text: ends with Archmage Celindra. Keeper Bel’varil’s Stone Tokens are not needed.
