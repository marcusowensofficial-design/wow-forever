            - paragraph [ref=f11e285]: Where City of Dalaran is, the level it asks for and what its drops require.
          - table [ref=f11e286]:
            - rowgroup [ref=f11e287]:
              - row [ref=f11e288]:
                - rowheader "Location" [ref=f11e289]
                - cell [ref=f11e290]:
                  - text: "In Dalaran, Alterac Mountains: through the city’s sewers, to a portal at the end of a long pipe. One member of the group who has done the attunement quests is enough for the whole group to go in."
                  - link "See the city on the world map" [ref=f11e291] [cursor=pointer]:
                    - /url: /map/eastern-kingdoms#p=279
                  - text: .
              - row [ref=f11e292]:
                - rowheader "Level" [ref=f11e293]
                - cell "28–33, the range Blizzard gives. Its quests can be taken from level 24." [ref=f11e294]
              - row [ref=f11e295]:
                - rowheader "Experience" [ref=f11e296]
                - cell "For the Alliance, its 4 quests give 37,600 XP, about 1 level at level 28. For the Horde, its 4 quests give 37,600 XP, about 1 level at level 28. Quest by quest" [ref=f11e297]:
                  - generic [ref=f11e298]: For the Alliance, its 4 quests give 37,600 XP, about 1 level at level 28.
                  - generic [ref=f11e299]: For the Horde, its 4 quests give 37,600 XP, about 1 level at level 28.
                  - link "Quest by quest" [ref=f11e300] [cursor=pointer]:
                    - /url: "#quests"
              - row [ref=f11e301]:
                - rowheader "Drops" [ref=f11e302]
                - cell "28 drops, 28 seen in the beta. They require level 25 to 30 and are item level 31 to 35." [ref=f11e303]
              - row [ref=f11e304]:
                - rowheader "Bosses" [ref=f11e305]
                - cell [ref=f11e306]:
                  - link "Atrexis the Grave Knight" [ref=f11e308] [cursor=pointer]:
