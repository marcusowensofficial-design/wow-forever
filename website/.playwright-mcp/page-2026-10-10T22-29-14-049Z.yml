            - generic "Level 45 books" [ref=f2e1073] [cursor=pointer]
          - group [ref=f2e1074]:
            - generic "Level 60 books" [ref=f2e1075] [cursor=pointer]
          - paragraph [ref=f2e1076]: "One small detail: almost every book ends its description with some version of “A fine addition to any library’s collection.” Crimes Against Anatomy, written by Doctor Krastinov, is the exception: it’s only described as “a questionable addition.”"
        - region [ref=f2e1077]:
          - heading "1 book we cannot place" [level=2] [ref=f2e1078]
          - list [ref=f2e1079]:
            - listitem [ref=f2e1080]:
              - generic [ref=f2e1081]:
                - text: "Ataeric: On Arcane Curiosities"
                - paragraph [ref=f2e1082]: "Not in the Sepulcher: players report searching it, downstairs near Sebastian Meloche included, and finding nothing, even though Wowhead’s Forever database still lists it there. Not behind Arugal in Shadowfang Keep either: the book there is the Black Tome, a quest item unrelated to the library. If you find it, tell us where."
        - region [ref=f2e1083]:
          - heading "Sources and verification" [level=2] [ref=f2e1085]
          - paragraph [ref=f2e1086]: The two librarians’ quest lists, the book items, their containers and their spawn points come from Wowhead’s Forever database, checked on September 22, 2026.
          - paragraph [ref=f2e1087]: Names and descriptions come directly from the beta client, build 1.60.1.70338.
          - paragraph [ref=f2e1088]: We also queried the beta server for all 21 quests in the chain using an addon. The server returned data for 18 of them, confirming that the questline is active in Forever rather than simply leftover Season of Discovery data.
          - paragraph [ref=f2e1089]: "The number of books each reward asks for is not in the client. A player on r/wowforever handed them in on the beta and posted both windows: 10 books for the necklace, 20 for the ring."
          - paragraph [ref=f2e1090]: As of October 4, 2026, many players who handed in the level 30 quest on the beta told us it takes 25 books. Season of Discovery, which wrote this chain, asked 25 for the same quest. One reader had counted 30 on October 3.
          - paragraph [ref=f2e1091]: "Players confirmed two positions in the beta on September 22, 2026: The Lessons of Ta’zo in Orgrimmar, and Secrets of the Dreamers in Scrolls at 52.8, 54.7 inside the cave. Ataeric: On Arcane Curiosities is still missing: players report finding nothing in the Sepulcher, where Wowhead’s Forever database puts it, and a reader told us on September 23 that the book behind Arugal in Shadowfang Keep is the Black Tome, a quest item unrelated to the library. The same reader placed Sanguine Sorcery on top of the Sunken Temple. We have not checked these in game ourselves."
          - paragraph [ref=f2e1092]:
            - text: "On September 30, 2026, 桌游极客 filmed two books of the Plaguelands picked up alone, where Wowhead’s Forever database puts them:"
            - link "Undead Potatoes" [ref=f2e1093] [cursor=pointer]:
