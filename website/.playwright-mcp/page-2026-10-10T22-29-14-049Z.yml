          - heading "Library books Locations and rewards" [level=1] [ref=f2e67]:
            - text: Library books
            - generic [ref=f2e68]: Locations and rewards
          - paragraph [ref=f2e69]: The Season of Discovery library books are back in Forever, with new equipment rewards. Collect different books across Azeroth and turn them in to a librarian in Stormwind or Undercity.
          - paragraph [ref=f2e70]: Turn in 10 different books for a necklace, 20 in total for a ring, and 25 from level 30 for a bow, a shield or an off-hand. The first set contains 16 books, so reaching 25 takes at least 9 from higher-level zones.
          - paragraph [ref=f2e71]:
            - text: By Vektor, updated October 4, 2026.
            - link "Sources and verification" [ref=f2e72] [cursor=pointer]:
              - /url: "#sources"
