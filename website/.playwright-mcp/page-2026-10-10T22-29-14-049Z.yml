                - list [ref=f2e151]:
                  - listitem [ref=f2e152]: +12 Stamina
                  - listitem [ref=f2e153]: Requires Level 40
                  - listitem [ref=f2e154]: "Equip: +7 Fire Spell Damage"
          - paragraph [ref=f2e155]: "It takes 25 different books in total, the 20 of the ring included: five more after the ring. Many players who handed it in on the beta gave us that number, the same as in Season of Discovery."
        - region [ref=f2e156]:
          - heading "How to get the rewards" [level=2] [ref=f2e158]
          - paragraph [ref=f2e159]: The questline is open to all classes, not just mages. A level 1 warrior has picked up the first quest in the beta. The rewards ask for no level and no class.
          - paragraph [ref=f2e160]: "One important detail: the librarian only offers the quest if you’re already carrying a book."
          - list [ref=f2e161]:
            - listitem [ref=f2e162]:
              - heading "Find a book" [level=3] [ref=f2e163]
              - paragraph [ref=f2e164]: "The books don’t drop from mobs. Each one is looted from a fixed object in the world: a bookshelf, a pile of scrolls, a tome sitting on a table, and so on."
              - paragraph [ref=f2e165]: The first set has 16 different books. Locations are listed below, with notes where a position comes from a player report or still needs confirmation in Forever.
            - listitem [ref=f2e166]:
              - heading "Bring it to your librarian" [level=3] [ref=f2e167]
              - paragraph [ref=f2e168]: Each book you turn in rewards a Comprehension Charm.
              - paragraph [ref=f2e169]: "The coordinates below use the city map:"
              - generic [ref=f2e170]:
                - paragraph [ref=f2e171]:
                  - img "Alliance" [ref=f2e172]
                  - generic [ref=f2e173]: Garion Wendell
                  - generic [ref=f2e174]: Mage Quarter, Stormwind City (37.6, 80.8)
                - paragraph [ref=f2e175]:
                  - img "Horde" [ref=f2e176]
                  - generic [ref=f2e177]: Owen Thadd
                  - generic [ref=f2e178]: Magic Quarter, Undercity (73.4, 33.0)
            - listitem [ref=f2e179]:
              - heading "Collect your rewards at 10, 20 and 25 books" [level=3] [ref=f2e180]
              - paragraph [ref=f2e181]: Each book has its own quest, so you can turn them in as you find them. There’s no need to carry all 10 at once.
              - paragraph [ref=f2e182]: Your tenth turn-in unlocks Friend of the Library, which rewards the necklace.
              - paragraph [ref=f2e183]: Continue turning in different books. Your twentieth turn-in unlocks the ring reward.
              - paragraph [ref=f2e184]: "From level 30, your twenty-fifth turn-in unlocks the third quest: the bow, the shield or the off-hand."
          - generic [ref=f2e185]:
            - 'heading "For mages: Study" [level=3] [ref=f2e186]'
            - paragraph [ref=f2e187]: The librarians also give mages a quest of their own, Research Access, new in Forever. It opens Comprehension, a new mage skill, and its spell Study. We don’t know yet how many books it takes before the quest appears.
            - paragraph [ref=f2e188]:
              - text: Study can be cast from level 6. It uses a
              - link "Light Feather" [ref=f2e189] [cursor=pointer]:
                - /url: /item/17056
              - text: ", takes 6 seconds, has a one hour cooldown and gives a"
              - link "Bundle of Scrolls" [ref=f2e190] [cursor=pointer]:
                - /url: /item/277651
              - text: . The spell says it needs a suitable library. The 17 bundles opened so far on Wowhead held Scroll of Minor Evocation,
              - link "Scroll of Imbue Lesser Flame" [ref=f2e191] [cursor=pointer]:
                - /url: /item/274947
              - text: ","
              - link "Scroll of Imbue Chillknife" [ref=f2e192] [cursor=pointer]:
                - /url: /item/275067
              - text: ","
              - link "Scroll of Rat Familiar" [ref=f2e193] [cursor=pointer]:
                - /url: /item/275069
              - text: ", and Scroll of Comprehension."
