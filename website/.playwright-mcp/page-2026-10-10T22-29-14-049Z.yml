          - 'heading "20 books in total: choose your ring" [level=3] [ref=f2e108]'
          - paragraph [ref=f2e109]: "Choose one ring, whatever your class: Field Researcher’s Loop (Agility, Stamina) for a physical class, Philanthropist’s Ring (Intellect, spell power) for a caster. The loop was rogue-only until the level 30 update of October 1, 2026. The rings ask for no level, but the quest that gives them does: a player had no quest at 17, saw it grey at 19 and handed it in at 20 (September 24, 2026)."
          - list [ref=f2e110]:
            - listitem [ref=f2e111]:
              - generic [ref=f2e112]:
                - link "Philanthropist's Ring" [ref=f2e113] [cursor=pointer]:
                  - /url: /item/281635
                - generic [ref=f2e114]: Item Level 35
                - list [ref=f2e115]:
                  - listitem [ref=f2e116]: +5 Intellect
                  - listitem [ref=f2e117]: "Equip: Increases damage and healing done by magical spells and effects by up to 10."
            - listitem [ref=f2e118]:
              - generic [ref=f2e119]:
                - link "Field Researcher's Loop" [ref=f2e120] [cursor=pointer]:
                  - /url: /item/281634
                - generic [ref=f2e121]: Item Level 35
                - list [ref=f2e122]:
                  - listitem [ref=f2e123]: +7 Agility
                  - listitem [ref=f2e124]: +7 Stamina
          - paragraph [ref=f2e125]: "The first 10 books count toward the ring: you need 20 different books in total, not 30."
          - 'heading "25 books in total: Truthseeker''s Bow" [level=3] [ref=f2e126]'
          - paragraph [ref=f2e127]: "A third Greater Friend of the Library opens at level 30. Since the October 8 update, Truthseeker’s Bow asks for level 40 like the shield and the off-hand: none of its three rewards can be used at level 30."
          - list [ref=f2e128]:
            - listitem [ref=f2e129]:
