          - heading "WoW Forever rares Where they spawn and what they drop" [level=1] [ref=f1e67]:
            - text: WoW Forever rares
            - generic [ref=f1e68]: Where they spawn and what they drop
          - paragraph [ref=f1e69]: In WoW Forever, rares are worth the detour again. Humar, Swiftmane and Takk the Leaper, the Barrens rares every Classic player knows, now each drop a piece of a set that makes you faster in the Barrens. A new elite that patrols the Wetlands drops the innards that buy Malignant Root, a ring any level can wear. And every starting zone has new rares of its own, several of them new pets for hunters.
          - paragraph [ref=f1e70]: By Vektor, updated October 5, 2026.
