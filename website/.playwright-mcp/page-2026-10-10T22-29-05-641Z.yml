                - definition [ref=f1e211]: It comes out of the sea on the west coast, then walks up the main river toward the dam, where it despawns. Two or three can be up at once. It comes out at night, server time. Some players killed it as early as 6:30 pm, but most groups find it from 9 pm. It respawns 5 to 30 minutes after it dies. It can be slowed and kited.
