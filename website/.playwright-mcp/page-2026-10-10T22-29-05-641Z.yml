            - paragraph [ref=f1e1413]: Wowhead’s Forever database lists these rares without a position; some stand inside dungeons. Lyn the Ignored, Death Wailer, Varkharn the Vigilant, Ganoloth the Tireless, Unyielding Eye, Legion Hulk, Sarinnia Wormwing, Old Thornpaw, Defias Vintner, Boulupulo, Jezerelle the Swaying, Spectral Citizen, Reginald Holmsby, Bannerwing Survivor, Kargra the Blind, Mad Marrius, Twilight Forgemaster, Gul'gash, Mosh'gra, Overseer Myoleth, Old Ironfang, Old Rusthowl, Scaldaron.
        - generic [ref=f1e1414]:
          - paragraph [ref=f1e1415]: "Positions and the list of new rares: Wowhead’s Forever database, read on September 23, 2026. Drops, respawns and routes: players’ comments there and on Reddit, and Wowhead’s news of the Barrens set. Item names, stats and set bonuses: the beta client. The pictures are each rare’s model from the beta client, rendered by us, except three: Aean Swiftriver and Foreman Rigger are players’ screenshots, Dro’zem the Blasphemous comes from Wowhead’s 3D viewer."
          - paragraph [ref=f1e1416]: Seen one elsewhere, or found what it drops? Tell us the zone and the coordinates.
