                - term [ref=f1e514]: What to know
                - definition [ref=f1e515]: "Four Alliance scouts who ride together, as in Classic: Aean Swiftriver leads, and Thora Feathermoon, Hannah Bladeleaf and Marcus Bel follow her. They take the road of the southern Barrens from Bael Modan, around 48, 80, north past Camp Taurajo to about 45, 42, and back. Each one can drop a weapon of their own, but not every time: on September 30 a reader killed Aean and Thora in a raid group and got nothing from Aean and two ordinary greens from Thora. They are elites of level 24 and 25 and fight together: bring a group."
