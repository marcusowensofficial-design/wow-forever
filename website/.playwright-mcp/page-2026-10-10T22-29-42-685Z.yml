      - generic [ref=f6e64]:
        - generic [ref=f6e65]:
          - link "Guides" [ref=f6e66] [cursor=pointer]:
            - /url: /guides
          - heading "The items Blizzard is hiding WoW Forever beta" [level=1] [ref=f6e67]:
            - text: The items Blizzard is hiding
            - generic [ref=f6e68]: WoW Forever beta
          - paragraph [ref=f6e69]: "In WoW, datamining often reveals new items weeks before release, and the BiS lists are ready before the first item drops. Blizzard wants Forever to be discovered in game: for thousands of items, the files now hold only the icon and the slot, and the name and stats come from the server once a player has seen the item."
          - paragraph [ref=f6e70]: Of the 2,425 new items in Forever, players have revealed 640 so far (26%). Blizzard also hid 5,006 Classic items, and encrypted the next dungeons and raids.
          - paragraph [ref=f6e71]: "Light spoilers below: the items already revealed and the names of the new sets."
          - paragraph [ref=f6e72]: By Vektor, updated October 10, 2026.
