        - region [ref=f6e1316]:
          - heading "What is encrypted" [level=2] [ref=f6e1318]
          - paragraph [ref=f6e1319]: "This time the data is in the files, but encrypted: nobody can read it without a key, and Blizzard only sends the key the day it opens the content. Until then, all anyone can do is count what each key protects. There are 13:"
          - list [ref=f6e1320]:
            - listitem [ref=f6e1321]: Two raids and their 22 bosses. Blizzard has announced two, Hyjal and the Barrow Deeps, and these are almost certainly them.
            - listitem [ref=f6e1322]: A series of 79 quests in a zone of their own, with 63 items and a boss.
            - listitem [ref=f6e1323]: "The five new dungeons from level 35 up and their 34 bosses: they are the only new dungeons whose maps are missing from the files."
            - listitem [ref=f6e1324]: 10 more quests, with a battle pet.
            - listitem [ref=f6e1325]: 1 more quests, with a battle pet.
            - listitem [ref=f6e1326]: Two mounts, one key each.
            - listitem [ref=f6e1327]: A battle pet.
            - listitem [ref=f6e1328]: Two cosmetic items, one key each.
          - paragraph [ref=f6e1329]:
            - text: None of them is on the
            - link "public list of known keys" [ref=f6e1330] [cursor=pointer]:
              - /url: https://github.com/wowdev/TACTKeys
            - text: .
        - paragraph [ref=f6e1332]: "Sources: the beta files, Raidbots’ cache read on October 10, and AtlasLootClassic’s loot lists for the raids."
