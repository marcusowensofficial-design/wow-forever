      - generic [ref=f6e142]:
        - region [ref=f6e143]:
          - heading "What Blizzard hides" [level=2] [ref=f6e145]
          - paragraph [ref=f6e146]: Blizzard announced it at BlizzCon.
          - blockquote [ref=f6e147]:
            - paragraph [ref=f6e148]: “One of the things we’re doing is we’re actually obfuscating all items in the game. So you will not see an item’s stats until it drops for you, until it drops for someone on your server. So that means you will not go into the first raid tier knowing what your BiS list is. The first week will be the Wild West of people getting items and going up on Wowhead or whatever. […] I think we’re hoping to capture as much of that surprise and discovery as possible.”
            - generic [ref=f6e149]:
              - text: Josh Greenfield, senior game designer, in
              - link "an interview with MMORPG.com at BlizzCon" [ref=f6e150] [cursor=pointer]:
                - /url: https://www.mmorpg.com/interviews/blizzcon-2026-interview-chatting-wow-forevers-campsites-horizontal-progression-and-more-with-blizzard-2000138932
          - generic [ref=f6e151]:
            - generic [ref=f6e152]:
              - heading "In the files" [level=3] [ref=f6e153]
              - list [ref=f6e154]:
                - listitem [ref=f6e155]: Its number, so you know it exists
                - listitem [ref=f6e156]: Its icon
                - listitem [ref=f6e157]: "Its slot and its type: Plate, Sword, Cloak…"
                - listitem [ref=f6e158]: The name of the set it belongs to
            - generic [ref=f6e159]:
              - heading "Missing from the files" [level=3] [ref=f6e160]
              - list [ref=f6e161]:
                - listitem [ref=f6e162]: Its name and its quality
                - listitem [ref=f6e163]: Its item level and the level it requires
                - listitem [ref=f6e164]: Its stats, armor and damage
                - listitem [ref=f6e165]: Its effects (Equip, Use, Chance on hit) and its set bonuses
          - paragraph [ref=f6e166]: These items are not encrypted. Their data is not in the files, so nobody can extract it before the server sends it.
        - region [ref=f6e167]:
          - heading "How an item gets revealed" [level=2] [ref=f6e169]
          - list [ref=f6e170]:
            - listitem [ref=f6e171]:
              - generic [aria-hidden] [ref=f6e172]: "1"
              - generic [ref=f6e173]: You loot the item, see it at a vendor, click its link in chat, or an addon asks for it.
            - listitem [ref=f6e174]:
              - generic [aria-hidden] [ref=f6e175]: "2"
              - generic [ref=f6e176]: The game asks Blizzard’s server for its details. Until the answer comes, the tooltip reads Retrieving item information.
            - listitem [ref=f6e177]:
              - generic [aria-hidden] [ref=f6e178]: "3"
              - generic [ref=f6e179]: The server answers with the name, stats and effects, and the game keeps them in a cache file in your WoW folder.
            - listitem [ref=f6e180]:
              - generic [aria-hidden] [ref=f6e181]: "4"
              - generic [ref=f6e182]:
                - link "Raidbots" [ref=f6e183] [cursor=pointer]:
                  - /url: https://www.raidbots.com/
                - text: ", a simulation site, gathers the cache files of many players into one. Every item in that file has its page here, updated every two hours."
          - heading "Asking is not enough" [level=3] [ref=f6e184]
          - paragraph [ref=f6e185]: On September 25, I used an addon to ask the server for all 12,600 hidden items, one by one. It answered for about a third and sent nothing for the rest.
        - region [ref=f6e186]:
          - heading "How many are revealed" [level=2] [ref=f6e188]
          - generic [ref=f6e189]:
            - paragraph [ref=f6e190]:
              - text: 640 of the 2,425 new items revealed
