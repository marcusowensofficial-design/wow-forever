        - region [ref=f3e1131]:
          - heading "Attack speed" [level=2] [ref=f3e1133]
          - paragraph [ref=f3e1134]: "In Forever every pet swings every 2.0 seconds, and a passive the beast brings with it changes that: Faster Attack I to VII, or Slower Attack II and III. Their percentages land exactly on the speeds the same beasts had in Classic, and beta players find their tames at those speeds, so Classic’s number is the one to go by. Beta players also find that a pet’s hits are not made bigger to make up for a slow swing, so for now a fast pet simply deals more damage. Nobody knows yet whether that is intended."
