        - region [ref=f3e1177]:
          - heading "How training works" [level=2] [ref=f3e1179]
          - paragraph [ref=f3e1180]: "Training still works as in Classic. To teach your pet an ability:"
          - list [ref=f3e1181]:
            - listitem [ref=f3e1182]: Tame a beast that knows it. The Teaches column of the list above says which beast knows which rank.
            - listitem [ref=f3e1183]: Fight with it until you learn the ability. The message is a line of yellow text with no rank in it, easy to miss.
            - listitem [ref=f3e1184]: Take your own pet back and teach it with Beast Training. Each ability costs training points. Pet trainers sell the general abilities, such as Growl and the resistances, for training points too.
          - paragraph [ref=f3e1185]: "Loyalty gates training: your pet has to gain a loyalty level before it can be taught, and players find loyalty rises very slowly."
          - paragraph [ref=f3e1186]: You can tame a beast up to two levels above your own. Beast Lore, which shows what a beast knows before you tame it, is learned at level 24.
          - paragraph [ref=f3e1187]: Pets that come from the Skyborne area (the Vuldren foxes, the cranes) have been reported losing their abilities after being dismissed or after a relog. That is a beta bug, not a rule.
        - region [ref=f3e1188]:
          - heading "Sources" [level=2] [ref=f3e1190]
          - paragraph [ref=f3e1191]: Families, diets, abilities, ranks, levels, tooltips and the attack speed passives come from the beta client, build 1.60.1.70338, compared with Classic Era’s, build 1.15.9.69722.
          - paragraph [ref=f3e1192]: A family’s damage, armor and health are the values of its Tamed Pet Passive in the beta client.
          - paragraph [ref=f3e1193]: Where a Classic beast is, its level and its speed come from the cMaNGOS Classic database. Forever’s new beasts come from Wowhead’s Forever database, read on September 23, and from what beta players posted, each named with its report.
          - paragraph [ref=f3e1194]: What a beast teaches comes from Classic Era’s client (CreatureSpellData). Forever may have changed it for some beasts.
          - paragraph [ref=f3e1195]:
            - text: What changed for every pet, and how damage goes with attack speed, come from beta players, gathered on the
            - link "Forever Hunter wiki" [ref=f3e1196] [cursor=pointer]:
              - /url: https://github.com/classic-hunter/forever-hunter/wiki/Forever-Beta-Changes
            - text: .
          - paragraph [ref=f3e1197]: How training works comes from beta players on the Petopia forum and the official forums, 18 to 22 September 2026.
          - paragraph [ref=f3e1198]: Tamed something this page does not list, or found another speed? Tell us the beast, its level, where it was and what its tooltip says.
