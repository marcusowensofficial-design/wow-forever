      - generic [ref=f13e110]:
        - generic [ref=f13e111]:
          - heading "WoW Forever world map" [level=1] [ref=f13e112]
          - paragraph [ref=f13e113]: "An interactive world map of WoW Forever made from the beta client's own files, flat or as 3D terrain: the two continents, Zephras Isle, Dalaran City and the dungeons. Type your level to see which zones fit, and find dungeon entrances, flight masters, boats, inns and graveyards."
          - generic [ref=f13e114]:
            - heading "How to get to the new zones" [level=2] [ref=f13e115]
            - generic [ref=f13e116]:
              - article [ref=f13e117]:
                - heading "Riverglades 36–44" [level=3] [ref=f13e118]:
                  - link "Riverglades" [ref=f13e119] [cursor=pointer]:
                    - /url: /map/eastern-kingdoms/riverglades
                  - generic [ref=f13e120]: 36–44
                - paragraph [ref=f13e121]: By boat from Steamwheedle Port in Tanaris to Powderfuse Port. Horde flies to Rog'mar from Stonard, Kargath, Flame Crest or Hammerfall. Alliance flies to Farholde Keep from Lakeshire, Morgan's Vigil or Thelsamar. On foot, Blizzard says the zone connects to Burning Steppes, Redridge Mountains, Swamp of Sorrows and Badlands.
              - article [ref=f13e122]:
                - heading [level=3] [ref=f13e123]:
                  - link "Mount Hyjal" [ref=f13e124] [cursor=pointer]:
                    - /url: /map/kalimdor/mount-hyjal
                - paragraph [ref=f13e125]: Both factions fly to Tainted Foothills from Everlook in Winterspring. That is the only flight path into the zone in the client, which gives Hyjal no level range yet.
              - article [ref=f13e126]:
                - heading [level=3] [ref=f13e127]:
                  - link "Shen'dralas" [ref=f13e128] [cursor=pointer]:
                    - /url: /map/kalimdor/shendralas
                - paragraph [ref=f13e129]: A small zone north of Dire Maul, where Desolace, Feralas and Mulgore meet. The client gives it no flight master and no level range yet.
              - article [ref=f13e130]:
                - heading "Zephras Isle 1–12" [level=3] [ref=f13e131]:
                  - link "Zephras Isle" [ref=f13e132] [cursor=pointer]:
                    - /url: /map/zephras-isle
                  - generic [ref=f13e133]: 1–12
                - paragraph [ref=f13e134]: The Skyborne starting zone, shared by both factions. It has a map of its own. The Alliance skyship leaves from Dalaran, the Horde one from Skywatcher Plateau, north of Thunder Bluff.
          - generic [ref=f13e135]:
