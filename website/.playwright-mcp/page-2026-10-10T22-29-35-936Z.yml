            - paragraph [ref=f5e355]: "Rank Points: what it takes to reach that rank from the one before. Total: from the start. Earliest: the first week of a season when the game lets you reach it."
          - region [ref=f5e356]:
            - heading "The weekly cap" [level=2] [ref=f5e358]
            - paragraph [ref=f5e359]: "Each week, the game raises the highest rank you can reach this season, up to rank 14 in week 10. The limit counts everything you’ve earned since the season began, so starting late doesn’t hold you back: a player who starts in week 5 can go straight to rank 8 (10,200 points)."
