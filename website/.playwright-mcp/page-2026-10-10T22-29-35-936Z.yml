      - generic [ref=f5e62]:
        - generic [ref=f5e65]:
          - generic [ref=f5e66]:
            - link "Guides" [ref=f5e67] [cursor=pointer]:
              - /url: /guides
            - heading "PvP ranks and Honor WoW Forever" [level=1] [ref=f5e68]:
              - text: PvP ranks and Honor
              - generic [ref=f5e69]: WoW Forever
            - paragraph [ref=f5e70]: "The 14 PvP ranks of original WoW are back in Forever, from Private to Grand Marshal for the Alliance and from Scout to High Warlord for the Horde. Battlegrounds and PvP quests give you two things: Honor, which you spend on PvP gear, and Rank Points, which raise your rank. Each new rank unlocks rewards you can buy."
            - paragraph [ref=f5e71]: "You can’t climb as fast as you like: each week, the game raises the highest rank you can reach, and rank 14 opens in the tenth week of a season at the earliest. In 2004, your rank depended on how much you played compared with the rest of your server. In Forever, every player needs the same number of points."
            - paragraph [ref=f5e72]:
              - text: "Below: what each rank takes and unlocks, how Honor buys the PvP sets, and what you can already do at level 30 on the beta, where"
              - link "Darkspear Islands" [ref=f5e73] [cursor=pointer]:
                - /url: "#darkspear"
              - text: ", the new 15 against 15 battleground, is open."
            - paragraph [ref=f5e74]: By Vektor, updated October 7, 2026.
          - figure [ref=f5e75]:
            - img "The Player vs. Player tab of the character pane, on a Horde character at rank 0" [ref=f5e76]
