            - paragraph [ref=f5e954]: All of them need level 28, and most come again for levels 38, 48 and 58.
            - paragraph [ref=f5e955]: "Rank Points don’t seem to count on the beta yet: the PvP tab still reads 0 / 750 for players who have farmed 2,000 Honor."
            - paragraph [ref=f5e956]:
              - text: For the rest of your gear at 30, each class has a PvP list among our
              - link "best-in-slot lists" [ref=f5e957] [cursor=pointer]:
                - /url: /bis
              - text: ", and the"
              - link "duel tournament" [ref=f5e958] [cursor=pointer]:
                - /url: /duel-tournament
              - text: guide covers the level 30 Horde tournament of October 17 and 18.
          - region [ref=f5e959]:
            - heading "Questions" [level=2] [ref=f5e961]
            - generic [ref=f5e962]:
              - generic [ref=f5e963]:
                - term [ref=f5e964]: Does rank decay?
                - definition [ref=f5e965]: "Blizzard hasn’t mentioned decay, and nothing in the game takes points away: your rank is a bar that only fills. Classic Era itself stopped decay in December 2023."
              - generic [ref=f5e966]:
                - term [ref=f5e967]: Does my rank reset every season?
                - definition [ref=f5e968]: Blizzard hasn’t said. The PvP tab shows the season and a countdown to its end, the lead designer said rank 14 can be reached “within a season or within a patch cycle”, and the roadmap plans a PvP season refresh in spring 2027 and another in summer 2027.
              - generic [ref=f5e969]:
                - term [ref=f5e970]: When does the first season start?
                - definition [ref=f5e971]: No date yet. Forever launches on November 4, and Blizzard hasn’t said whether the first PvP season starts the same day.
              - generic [ref=f5e972]:
                - term [ref=f5e973]: Do I need Alterac Valley?
                - definition [ref=f5e974]: No. Blizzard evened out the Honor each battleground gives, Alterac Valley opens only at level 51, and it isn’t in the Call to Arms rotation. It still counts for the journey’s kill tasks and for its Legacy reputation.
              - generic [ref=f5e975]:
                - term [ref=f5e976]: Does world PvP count?
                - definition [ref=f5e977]: Honorable kills anywhere give Honor. Rank Points, in the game’s own words, come from battlegrounds and from tasks given in Gadgetzan.
              - generic [ref=f5e978]:
                - term [ref=f5e979]: What happens to Rank Points past the weekly cap?
                - definition [ref=f5e980]: Blizzard hasn’t said whether they wait for next week’s cap or are lost.
              - generic [ref=f5e981]:
                - term [ref=f5e982]: Do I need a rank to buy the blue set?
                - definition [ref=f5e983]: No. The blue pieces need level 55 and Honor, nothing else. Ranks gate the seals, the rank rewards and the weapons.
              - generic [ref=f5e984]:
                - term [ref=f5e985]: Are there arenas or rated battlegrounds?
                - definition [ref=f5e986]: None announced. The beta holds two arenas, Hyjal Crater and Mak’gora Arena, and a Battle for Gilneas map that Blizzard hasn’t talked about.
          - generic [ref=f5e987]:
            - paragraph [ref=f5e988]:
              - text: Blizzard’s articles on
              - link "PvP progression" [ref=f5e989] [cursor=pointer]:
                - /url: https://worldofwarcraft.blizzard.com/en-us/news/24303316/how-pvp-progression-in-world-of-warcraft-forever-works
              - text: and on
              - link "Darkspear Islands" [ref=f5e990] [cursor=pointer]:
