            - paragraph [ref=f5e860]: Point at a piece for its tooltip. Each set also has a bracer and a belt outside the set, blue and epic, the epic ones from rank 8.
          - region [ref=f5e861]:
            - heading "Where the points come from" [level=2] [ref=f5e863]
            - paragraph [ref=f5e864]: Rank Points come from battlegrounds and from tasks given in Gadgetzan. Honor comes from the same places, and from every honorable kill. Battlegrounds mix players from every ruleset except Hardcore.
            - table [ref=f5e866]:
              - rowgroup [ref=f5e867]:
                - row [ref=f5e868]:
                  - columnheader "Battleground" [ref=f5e869]
                  - columnheader "Levels" [ref=f5e870]
                  - columnheader "Players" [ref=f5e871]
                  - columnheader "Call to Arms" [ref=f5e872]
              - rowgroup [ref=f5e873]:
                - row [ref=f5e874]:
                  - rowheader "Warsong Gulch" [ref=f5e875]
                  - cell "10–60" [ref=f5e876]
                  - cell "10 vs 10" [ref=f5e877]
                  - cell "Yes" [ref=f5e878]
                - row [ref=f5e879]:
                  - rowheader "Arathi Basin" [ref=f5e880]
                  - cell "20–60" [ref=f5e881]
                  - cell "15 vs 15" [ref=f5e882]
                  - cell "Yes" [ref=f5e883]
                - row [ref=f5e884]:
                  - rowheader "Darkspear IslandsNew" [ref=f5e885]
                  - cell "30–60" [ref=f5e886]
                  - cell "15 vs 15" [ref=f5e887]
                  - cell "Yes" [ref=f5e888]
                - row [ref=f5e889]:
                  - rowheader "Alterac Valley" [ref=f5e890]
                  - cell "51–60" [ref=f5e891]
                  - cell "40 vs 40" [ref=f5e892]
                  - cell "No" [ref=f5e893]
            - paragraph [ref=f5e894]: "Each week, one of the first three is the Call to Arms battleground, in turn: Darkspear Islands, then Arathi Basin, then Warsong Gulch. That week it gives more Honor and more Rank Points."
            - generic [ref=f5e895]:
              - generic [ref=f5e896]:
                - heading "The Field of Honor journey" [level=3] [ref=f5e897]
                - paragraph [ref=f5e898]: "Each season comes with ten weekly quests that give Honor and Rank Points. Weeks 4, 7 and 10 also give a Legacy point each, and those three stay open in later seasons. The quests aren’t public yet, but these are the tasks waiting in the game:"
                - list [ref=f5e899]:
                  - listitem [ref=f5e900]: Complete 3 Warsong Gulch, Arathi Basin or Darkspear Islands battles
                  - listitem [ref=f5e901]: Win a Warsong Gulch, Arathi Basin, Darkspear Islands or Alterac Valley battle
                  - listitem [ref=f5e902]: 25 kills in Warsong Gulch, Arathi Basin or Darkspear Islands
                  - listitem [ref=f5e903]: 200 kills in Alterac Valley
                  - listitem [ref=f5e904]: 25 kills in the Gurubashi Arena
                  - listitem [ref=f5e905]: Win 10 duels
              - generic [ref=f5e906]:
                - heading "12 Legacy points" [level=3] [ref=f5e907]
                - paragraph [ref=f5e908]:
                  - text: PvP pays 12 of the
                  - link "Legacy" [ref=f5e909] [cursor=pointer]:
                    - /url: /legacy-perks#challenges
                  - text: "points a character can earn, one each:"
                - list [ref=f5e910]:
                  - listitem [ref=f5e911]: ranks 3, 7, 10, 13, 14
                  - listitem [ref=f5e913]: Exalted with each battleground’s faction
                  - listitem [ref=f5e915]: weeks 4, 7, 10 of the journey
          - region [ref=f5e917]:
            - heading "Darkspear Islands at level 30" [level=2] [ref=f5e919]
            - paragraph [ref=f5e920]:
              - text: "It’s the new battleground, and the only one the beta lets you queue, from level 30. Fifteen against fifteen on islands off the coast of Kalimdor: four bases to hold, a flag in the middle to carry to one of yours, first team to 2,000 points. Stay out of the water:"
              - link "sharks" [ref=f5e921] [cursor=pointer]:
                - /url: https://www.youtube.com/watch?v=rX2rtTozuqA&t=678s
              - text: .
            - paragraph [ref=f5e922]: "Queue at the battlemaster of any capital, or in the Barrens at your side’s base: Northwatch, where a portal takes you in . Wins and marks build up your standing with the Theramore Expeditionary Force , whose quartermaster sells gear you can wear at 30. Hand in 3 marks for 30 Honor and reputation at level 30 to 39, and the tabard waits at Exalted."
            - list [ref=f5e923]:
              - listitem [ref=f5e924]:
                - heading "Honored" [level=4] [ref=f5e925]
