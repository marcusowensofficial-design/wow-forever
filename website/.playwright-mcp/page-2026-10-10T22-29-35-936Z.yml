            - paragraph [ref=f5e411]: "Two ranks are never a week’s ceiling: 4 and 10. Week 7 jumps two ranks at once, to 11 and the black war mounts. How many Rank Points a battleground or a quest gives is not public yet, so neither is the number of games a week takes."
          - region [ref=f5e412]:
            - heading "Honor and the PvP sets" [level=2] [ref=f5e414]
            - generic [ref=f5e415]:
              - generic [ref=f5e416]:
                - heading "Honor" [level=3] [ref=f5e417]
                - paragraph [ref=f5e418]: "Honor comes from killing players of the other faction, from battlegrounds and from PvP quests, and lands at once in your currencies. You can hold 25,000: Blizzard raised the cap from 15,000 on October 1, when it put most PvP prices up by about 50%. The new prices aren’t public yet."
                - paragraph [ref=f5e419]:
                  - text: Every battleground now gives about the same Honor for your time, so Alterac Valley is no longer the only efficient one. The
                  - link "Legacy" [ref=f5e420] [cursor=pointer]:
                    - /url: /legacy-perks#challenges
                  - text: perk For Great Honor adds up to 10%.
              - generic [ref=f5e421]:
                - heading "Blue, then epic" [level=3] [ref=f5e422]
                - paragraph [ref=f5e423]: "Each set comes in blue for Honor, item level 60, from level 55, with no rank needed. The epic version, item level 65, needs level 60: you bring the blue piece and the Emboldened Seal of its slot, and each seal is sold from a rank."
                - list [ref=f5e424]:
