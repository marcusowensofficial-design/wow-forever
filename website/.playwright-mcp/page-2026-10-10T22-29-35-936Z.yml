            - heading "What you need to know" [level=2] [ref=f5e94]
            - list [ref=f5e95]:
              - listitem [ref=f5e96]:
                - generic [ref=f5e97]:
                  - generic [ref=f5e98]: Honor and Rank Points
                  - generic [ref=f5e99]: Battlegrounds and PvP quests give both. Honor buys the PvP gear, and you can hold up to 25,000. Rank Points raise your rank and are never spent.
              - listitem [ref=f5e100]:
                - generic [ref=f5e101]:
                  - generic [ref=f5e102]: Rank 14 in ten weeks
                  - generic [ref=f5e103]: "It takes 24,750 Rank Points. Each week, the game raises the highest rank you can reach: rank 3 in week 1, rank 8 in week 5, rank 14 from week 10."
              - listitem [ref=f5e104]:
                - generic [ref=f5e105]:
                  - generic [ref=f5e106]: A reward at every rank
                  - generic [ref=f5e107]: A tabard at rank 1, a PvP trinket at rank 2, the black war mounts at rank 11, the weapons at rank 14.
              - listitem [ref=f5e108]:
                - generic [ref=f5e109]:
                  - generic [ref=f5e110]: Blue, then epic
                  - generic [ref=f5e111]: The blue PvP set is bought with Honor, from level 55. At level 60, an Emboldened Seal turns each piece into its epic version. The seals are sold from rank 8 to 13, depending on the slot.
