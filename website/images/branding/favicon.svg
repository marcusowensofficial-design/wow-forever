<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#07090e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="shieldPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gemGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)"/>

  <!-- Shield Outer Border -->
  <path d="M 32 6 L 52 14 C 52 34 44 48 32 58 C 20 48 12 34 12 14 Z" 
        fill="url(#shieldPlate)" 
        stroke="url(#goldRim)" 
        stroke-width="3" 
        stroke-linejoin="round"/>

  <!-- Inner Inset Shield -->
  <path d="M 32 11 L 47 17 C 47 32 41 43 32 51 C 23 43 17 32 17 17 Z" 
        fill="none" 
        stroke="#f59e0b" 
        stroke-width="1.2" 
        stroke-opacity="0.75" 
        stroke-dasharray="2 1.5"/>

  <!-- Center Arcane Crystal Core -->
  <polygon points="32,20 38,32 32,44 26,32" 
           fill="url(#gemGlow)" 
           filter="url(#glow)"/>
  <polygon points="32,23 35,32 32,41 29,32" 
           fill="#ffffff" 
           fill-opacity="0.8"/>

  <!-- Rune Marks -->
  <path d="M 22 24 L 25 24 M 22 28 L 24 28 M 39 24 L 42 24 M 40 28 L 42 28" 
        stroke="#fbbf24" 
        stroke-width="1.2" 
        stroke-linecap="round" 
        stroke-opacity="0.8"/>
</svg>
